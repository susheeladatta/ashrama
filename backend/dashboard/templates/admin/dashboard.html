<style>
/* Heatmap colors */
.hm-0 { background: #1f2937; }       /* dark gray */
.hm-low { background: #14532d; }     /* green */
.hm-mid { background: #78350f; }     /* amber */
.hm-high { background: #7f1d1d; }    /* red */

.hm-cell {
    color: #fff;
    font-weight: 600;
    text-align: center;
    border-radius: 4px;
    padding: 4px 6px;
}
.hm-label {
    font-size: 11px;
    opacity: 0.8;
}
</style>

<table class="admin-dashboard-table">
<thead>
<tr>
    <th>Building</th>
    <th>Private</th>
    <th>Female Dorm</th>
    <th>Male Dorm</th>
    <th>Repair</th>
</tr>
</thead>

<tbody>
{% for row in items %}
<tr>
    <td>
        <a href="{{ row.building_url }}">{{ row.building.name }}</a>
    </td>

    <!-- PRIVATE -->
    <td>
        <div class="hm-cell {% if row.priv_occ == 0 %}hm-low{% elif row.priv_occ < 3 %}hm-mid{% else %}hm-high{% endif %}">
            <span class="hm-label">Occ</span> {{ row.priv_occ }}
        </div>
        <div class="hm-cell {% if row.priv_avail == 0 %}hm-high{% else %}hm-low{% endif %}">
            <span class="hm-label">Avail</span> {{ row.priv_avail }}
        </div>
    </td>

    <!-- FEMALE -->
    <td>
        <div class="hm-cell {% if row.female_occ == 0 %}hm-low{% else %}hm-mid{% endif %}">
            <span class="hm-label">Occ</span> {{ row.female_occ }}
        </div>
        <div class="hm-cell {% if row.female_avail == 0 %}hm-high{% else %}hm-low{% endif %}">
            <span class="hm-label">Avail</span> {{ row.female_avail }}
        </div>
    </td>

    <!-- MALE -->
    <td>
        <div class="hm-cell {% if row.male_occ == 0 %}hm-low{% else %}hm-mid{% endif %}">
            <span class="hm-label">Occ</span> {{ row.male_occ }}
        </div>
        <div class="hm-cell {% if row.male_avail == 0 %}hm-high{% else %}hm-low{% endif %}">
            <span class="hm-label">Avail</span> {{ row.male_avail }}
        </div>
    </td>

    <!-- REPAIR -->
    <td>
        <div class="hm-cell {% if row.repair == 0 %}hm-low{% elif row.repair < 2 %}hm-mid{% else %}hm-high{% endif %}">
            {{ row.repair }}
        </div>
    </td>
</tr>
{% endfor %}
</tbody>
</table>
