{% extends "admin/change_form.html" %}
{% load i18n admin_urls static admin_modify %}

{% block extrahead %}
{{ block.super }}
<script type="text/javascript">
    django.jQuery(document).ready(function($) {
        console.log('DEBUG: Reservation change form loaded');
        console.log('Room field value:', $('#id_room').val());
        console.log('Building field value:', $('#id_building').val());
        
        // Force the room field to maintain its value
        var currentRoomId = {{ original.room_id|default:"null" }};
        if (currentRoomId && $('#id_room').val() == '') {
            console.log('WARNING: Room field is empty, fixing...');
            $('#id_room').val(currentRoomId);
        }
    });
</script>
{% endblock %}

{% block content %}
{{ block.super }}
<div style="display: none;">
    <!-- Debug information -->
    <div id="debug-info" data-room-id="{{ original.room_id|default:'' }}" 
         data-room-number="{{ original.room.number|default:'' }}"></div>
</div>
{% endblock %}
